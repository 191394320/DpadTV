name: build-4.4-compat-apk

# 这台机器上没有 JDK 和 Android SDK，所以把构建放在 Actions 里跑（公开仓库不占额度）。
# 产物是 debug 签名的 APK：能直接在盒子上装，但和上游正式版签名不同，
# 第一次装要先卸载原版 1.3.0，App 内的「检查更新」也升不了（签名不一致会拒绝安装）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 9.3 / Gradle 9.5 这套是上游验证过的组合，别随意降
          java-version: '25'

      # debug keystore 每次构建都现生成的话，每个包的签名都不一样，
      # 装新包就得先卸载，顺手把源地址、进度这些本地数据全清掉。缓存住同一个 key 才能覆盖安装。
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dpadtv-debug-keystore-v1

      # 缓存 Gradle 发行版和依赖，改一次代码不用重下几十兆；调试期一轮能省半分钟。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle.log

      # Actions 的日志要登录才能看，annotation 不用：把关键报错原样贴到运行摘要页，
      # 失败原因直接在时间线上可读，不用来回复制日志。
      - name: Report failure as annotations
        if: failure()
        run: |
          if [ ! -f /tmp/gradle.log ]; then
            echo "::error::no gradle log produced"
            exit 0
          fi
          {
            grep -E '^e: ' /tmp/gradle.log | head -25 || true
            sed -n '/What went wrong/,/Try:/p' /tmp/gradle.log | head -40 || true
            grep -E '^Caused by: ' /tmp/gradle.log | head -20 || true
          } > /tmp/err.txt
          [ -s /tmp/err.txt ] || tail -30 /tmp/gradle.log > /tmp/err.txt
          while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/#/%23/g' | cut -c1-400)
            if [ -n "$esc" ]; then echo "::error::$esc"; fi
          done < /tmp/err.txt
          exit 0

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: DpadTV-min19-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
